<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>Bärdia Baradaran</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      background: #101010;
      color: #f5f5f3;
      font-family: Arial, Helvetica, sans-serif;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 420px;
      overflow: hidden;
      isolation: isolate;
      background: #101010;
    }

    .image {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: grayscale(1) contrast(1.08) brightness(.84);
      animation: image-flicker 7s infinite;
    }

    .shade {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        transparent 57%,
        rgb(0 0 0 / 8%) 72%,
        rgb(0 0 0 / 58%) 100%
      );
    }

    .scanlines {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: .12;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 2px,
        rgb(0 0 0 / 32%) 3px,
        transparent 4px
      );
      mix-blend-mode: multiply;
    }

    .caption {
      position: absolute;
      right: 1.5rem;
      bottom: clamp(2rem, 6.5vh, 5rem);
      left: 1.5rem;
      z-index: 1;
      text-align: center;
      text-shadow: 0 1px 16px rgb(0 0 0 / 60%);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 3.5vw, 2.8rem);
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: .025em;
    }

    .status {
      margin: .65rem 0 0;
      font-size: clamp(.72rem, 1.35vw, 1rem);
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: .12em;
      text-transform: lowercase;
    }

    @keyframes image-flicker {
      0%, 8%, 10%, 42%, 44%, 72%, 74%, 100% {
        opacity: 1;
      }
      9% { opacity: .94; }
      43% { opacity: .97; }
      73% { opacity: .93; }
    }

    @media (max-width: 600px) {
      .caption {
        bottom: 5vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .image {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="hero">
    <img
      class="image"
      src="background.png"
      alt="Svartvit, kornig bild med en ljus gestalt i mitten"
    >
    <div class="shade" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <div class="caption">
      <h1>Bärdia Baradaran</h1>
      <p class="status">work in progress</p>
    </div>
  </main>
</body>
</html>
