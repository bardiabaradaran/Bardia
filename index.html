<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bärdia Baradaran</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    :root {
      --case: #d6d1c3;
      --case-dark: #aaa596;
      --screen: #eeeDE5;
      --ink: #24241f;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 44%, #e7e4da 0%, #c9c6bd 72%, #b8b5ac 100%);
      font-family: "Courier New", monospace;
    }

    .monitor {
      position: relative;
      width: min(900px, 92vw);
      padding: 3.3% 3.3% 2.2%;
      border: 1px solid #f0ede3;
      border-radius: 5% / 4%;
      background: linear-gradient(145deg, #e5e0d2, var(--case) 55%, #c4beaf);
      box-shadow:
        0 3px 0 #f1eee4 inset,
        0 -5px 0 var(--case-dark) inset,
        0 22px 45px #37352d45;
    }

    .screen {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 1.48 / 1;
      overflow: hidden;
      border: 10px solid #b8b3a5;
      border-radius: 5% / 7%;
      background:
        radial-gradient(ellipse at center, #f7f6ef 0%, var(--screen) 72%, #d9d8d0 100%);
      box-shadow:
        0 0 0 2px #f4f0e5,
        0 0 22px #39372e26 inset;
      text-align: center;
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        #27271f09 4px
      );
      opacity: 0.48;
    }

    .content {
      z-index: 1;
      width: 100%;
      padding: 2rem 1rem 3.5rem;
      transform: translateY(-1%);
    }

    h1 {
      margin: 0;
      font-family: "Press Start 2P", "Courier New", monospace;
      font-size: clamp(1.45rem, 5.1vw, 3.6rem);
      line-height: 1.55;
      letter-spacing: -0.09em;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 #24241f18;
    }

    .prompt {
      display: inline-block;
      margin-top: clamp(1.5rem, 4vw, 2.6rem);
      font-family: "Press Start 2P", "Courier New", monospace;
      font-size: clamp(0.58rem, 1.55vw, 0.95rem);
      line-height: 1.8;
      text-transform: lowercase;
      animation: blink 1.15s steps(2, start) infinite;
    }

    .prompt .arrow {
      margin-right: 0.55em;
    }

    .copyright {
      position: absolute;
      z-index: 1;
      bottom: 5.5%;
      left: 0;
      width: 100%;
      font-size: clamp(0.65rem, 1.3vw, 0.85rem);
      letter-spacing: 0.14em;
    }

    .chin {
      height: clamp(28px, 5.8vw, 52px);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #777365;
      font-family: "Press Start 2P", "Courier New", monospace;
      font-size: clamp(0.48rem, 1vw, 0.68rem);
      letter-spacing: 0.12em;
    }

    .stand {
      width: 34%;
      height: 22px;
      margin: 0 auto;
      background: linear-gradient(#bcb7a9, #d4cfc1 45%, #aaa596);
      clip-path: polygon(13% 0, 87% 0, 100% 100%, 0 100%);
      filter: drop-shadow(0 5px 3px #39372e26);
    }

    .base {
      width: 48%;
      height: 12px;
      margin: 0 auto;
      border-radius: 50%;
      background: linear-gradient(#d5d0c2, #aaa596);
      box-shadow: 0 7px 12px #39372e24;
    }

    @keyframes blink {
      to { visibility: hidden; }
    }

    @media (max-width: 520px) {
      .monitor {
        width: 94vw;
        padding: 5% 4% 2%;
        border-radius: 6% / 4%;
      }

      .screen {
        aspect-ratio: 0.96 / 1;
        border-width: 7px;
      }

      .content { padding-inline: 0.5rem; }
      h1 { font-size: clamp(1.2rem, 7vw, 2.2rem); }
      .prompt { font-size: clamp(0.5rem, 2.4vw, 0.72rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      .prompt { animation: none; }
    }
  </style>
</head>

<body>
  <main class="monitor" aria-label="Bärdia Baradaran">
    <section class="screen">
      <div class="content">
        <h1>Bärdia<br>Baradaran</h1>
        <div class="prompt"><span class="arrow">&gt;</span>work in progress</div>
      </div>
      <footer class="copyright">© 2026 BB</footer>
    </section>
    <div class="chin">BB</div>
  </main>

  <div class="stand" aria-hidden="true"></div>
  <div class="base" aria-hidden="true"></div>
</body>
</html>
