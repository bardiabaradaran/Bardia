<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bärdia Baradaran</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e8e6df;
      color: #171717;
      font-family: "Courier New", monospace;
    }

    main {
      width: min(92vw, 900px);
      min-height: min(78vh, 620px);
      display: grid;
      place-items: center;
      position: relative;
      border: 2px solid #171717;
      background: #f5f4ef;
      box-shadow: 10px 10px 0 #171717;
      text-align: center;
      padding: 3rem 1.5rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 9vw, 7rem);
      line-height: 0.95;
      letter-spacing: -0.08em;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 #bdbbb3;
    }

    .start {
      display: inline-block;
      margin-top: 2.5rem;
      color: inherit;
      font-size: clamp(1rem, 3vw, 1.4rem);
      text-decoration: none;
      animation: blink 1.2s steps(2, start) infinite;
    }

    .start:hover,
    .start:focus {
      background: #171717;
      color: #f5f4ef;
      outline: none;
    }

    footer {
      position: absolute;
      bottom: 1.25rem;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
    }

    @keyframes blink {
      to { visibility: hidden; }
    }

    @media (prefers-reduced-motion: reduce) {
      .start { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>Bärdia<br>Baradaran</h1>
      <a class="start" href="#" aria-label="Work in progress">
        &gt; work in progress
      </a>
    </div>
    <footer>© 2026 BB</footer>
  </main>
</body>
</html>
