<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>Bärdia Baradaran</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      background: #101010;
      color: rgb(245 245 243 / 76%);
      font-family: "Caveat", cursive;
      font-weight: 500;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 420px;
      overflow: hidden;
      isolation: isolate;
      background: #101010;
    }

    .image {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 66%;
      filter: grayscale(1) contrast(1.08) brightness(.2);
    }

    /* Transparent overlay made from the bright parts of the image. */
    .light-flicker {
      position: absolute;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 66%;
      opacity: .03;
      mix-blend-mode: screen;
      will-change: opacity, transform;
    }

    .figure-link {
      position: absolute;
      top: 14%;
      right: 29%;
      bottom: 7%;
      left: 29%;
      z-index: 2;
      display: block;
      cursor: pointer;
    }

    .figure-link:focus-visible {
      outline: 1px solid rgb(245 245 243 / 55%);
      outline-offset: -6px;
    }

    /* Soft darkening at the foot of the image keeps the two lines readable. */
    .shade {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(
        to bottom,
        transparent 57%,
        rgb(0 0 0 / 12%) 68%,
        rgb(0 0 0 / 74%) 100%
      );
      pointer-events: none;
    }

    /* Fine analog scan lines, kept subtle so the photo stays clear. */
    .scanlines {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: .12;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 2px,
        rgb(0 0 0 / 32%) 3px,
        transparent 4px
      );
      mix-blend-mode: multiply;
    }

    .caption {
      position: absolute;
      bottom: clamp(1.5rem, 5vh, 3.5rem);
      left: clamp(1.5rem, 6vw, 5rem);
      z-index: 2;
      text-align: left;
      text-shadow: 0 1px 16px rgb(0 0 0 / 60%);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.15rem, 2.5vw, 1.9rem);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .status {
      margin: 0 0 .65rem;
      font-size: clamp(1.15rem, 2.5vw, 1.9rem);
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: .02em;
      text-transform: lowercase;
    }

    @media (max-width: 600px) {
      .image,
      .light-flicker { object-position: center 66%; }
      .figure-link {
        top: 12%;
        right: 22%;
        bottom: 4%;
        left: 22%;
      }
      .caption {
        bottom: 4vh;
        left: 1.25rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .light-flicker { opacity: .35; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <img class="image" src="background.png" alt="Svartvit, kornig bild med en ljus gestalt i mitten">
    <a class="figure-link" href="https://www.instagram.com/bardiabaradaran/" target="_blank" rel="noopener noreferrer" aria-label="Öppna Bärdia Baradarans Instagramprofil"></a>
    <img class="light-flicker" src="flicker.png" alt="" aria-hidden="true">
    <div class="shade" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
  </main>
  <script>
    const figure = document.querySelector(".light-flicker");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (!reduceMotion) {
      const randomBetween = (min, max) => min + Math.random() * (max - min);

    function flicker() {
        const intensity = randomBetween(0.68, 1);
        const shift = Math.round(randomBetween(-2, 2));

        figure.style.opacity = intensity.toFixed(2);
        figure.style.transform = `translateX(${shift}px)`;

        const flashLength = randomBetween(18, 95);
        window.setTimeout(() => {
          figure.style.opacity = Math.random() < 0.4
            ? "0"
            : randomBetween(0.01, 0.1).toFixed(2);
          figure.style.transform = "translateX(0)";

          window.setTimeout(flicker, randomBetween(30, 145));
        }, flashLength);
      }

      flicker();
    }
  </script>
</body>
</html>
